server {
    listen 80;
    server_name beta-api.deepbim.net www.beta-api.deepbim.net;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name beta-api.deepbim.net www.beta-api.deepbim.net;

    ssl_certificate /etc/letsencrypt/live/beta-api.deepbim.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/beta-api.deepbim.net/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
