services:
  frontend:
    build:
      context: ..
      dockerfile: .docker_202/Dockerfile
    container_name: frontend_container_202
    ports:
      - "3003:5173"  # Ánh xạ từ host:3005 sang container:80
    networks:
      - beta_network
    restart: always

networks:
  beta_network:
    name: beta_network
    external: true