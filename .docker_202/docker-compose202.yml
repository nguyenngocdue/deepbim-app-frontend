services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx_proxy
    ports:
      - "3003:80"
      - "3004:443" # Thêm ánh xạ cho HTTPS
    volumes:
      - ./nginx-proxy.conf:/etc/nginx/conf.d/default.conf
      - certs:/etc/nginx/certs
      - certbot-www:/var/www/certbot
    restart: always
    networks:
      - beta_network
    depends_on:
      - frontend

  frontend:
    build:
      context: ..
      dockerfile: .docker_202/Dockerfile
    container_name: frontend_container_202
    expose:
      - "3003"
    networks:
      - beta_network
    volumes:
      - certs:/etc/nginx/certs

volumes:
  certs:
  certbot-www:

networks:
  beta_network:
    name: beta_network
    external: true
