services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    expose:
      - "80"
      - "443"
    networks:
      - custom_network

  frontend:
    build:
      context: ..
      dockerfile: .docker_202/Dockerfile
    container_name: frontend_container_202
    restart: always
    expose:
      - "443"
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge
