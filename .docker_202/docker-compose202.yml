services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
      - ../.docker_configs/certs:/etc/nginx/certs
    networks:
      - custom_network
    depends_on:
      - frontend

  frontend:
    build:
      context: ..
      dockerfile: .docker_202/Dockerfile
    container_name: frontend_container_202
    restart: always
    expose:
      - "3003" # Port mà Vite lắng nghe
    command: npm run dev # Đảm bảo chạy Vite dev server
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge