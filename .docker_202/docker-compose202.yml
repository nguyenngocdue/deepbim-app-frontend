services:
  nginx-proxy:
    image: nginx:latest
    container_name: nginx_proxy
    restart: always
    expose:
      - "80"
      - "443"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf  # Mount file cấu hình Nginx
      - ../.docker_configs/certs:/etc/nginx/certs:ro  # Đảm bảo mount chứng chỉ SSL, chỉ đọc (ro)
    networks:
      - custom_network
    depends_on:
      - frontend

  frontend:
    build:
      context: ..
      dockerfile: .docker_202/Dockerfile
    container_name: frontend_container_202
    restart: always
    expose:
      - "443"
    networks:
      - custom_network

networks:
  custom_network:
    driver: bridge
