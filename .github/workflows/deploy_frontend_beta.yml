name: Deploy Frontend to Server

on:
  push:
    branches:
      - develop_off
  workflow_dispatch:

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🛒 Checkout Code
        uses: actions/checkout@v3

      - name: 📦 Install Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'

      - name: 📥 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Frontend
        run: npm run build --legacy-peer-deps

      - name: 🚀 Remove Old Code from Server (develop branch)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.BETA_SERVER_HOST }}
          username: ${{ secrets.BETA_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.BETA_SERVER_PORT }}
          script: |
            rm -rf /var/www/deepbim_app_frontend_beta/*

      - name: 🚀 Upload New Code to Server (develop branch)
        if: github.ref == 'refs/heads/develop'
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.BETA_SERVER_HOST }}
          username: ${{ secrets.BETA_SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.BETA_SERVER_PORT }}
          source: './dist/*'
          target: '/var/www/deepbim_app_frontend_beta/'
