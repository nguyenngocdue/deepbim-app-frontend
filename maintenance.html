<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepBIM - Under Maintenance</title>
    <link rel="icon" href="https://minio.deepbim.net:9000/deepbim-fe/1749531131956-logo_no_bg.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes softBounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .animate-soft-bounce {
        animation: softBounce 1.6s infinite ease-in-out;
      }

      .fade-in {
        animation: fadeIn 1s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-[#020617] min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 text-white">
    <div class="w-full max-w-md sm:max-w-xl lg:max-w-3xl text-center p-6 sm:p-8 rounded-3xl bg-white/5 backdrop-blur-md shadow-2xl border border-white/10 fade-in max-h-[90vh] flex flex-col items-center justify-between">

      <!-- Logo + DeepBIM -->
      <div class="flex flex-col items-center">
        <img
          src="https://minio.deepbim.net:9000/deepbim-fe/1749531131956-logo_no_bg.png"
          alt="DeepBIM Logo"
          class="w-20 sm:w-24 h-auto object-contain animate-soft-bounce"
        />
        <span class="mt-2 text-2xl sm:text-3xl font-semibold tracking-wide text-white">
          DeepBIM
        </span>
      </div>

      <!-- Illustration -->
      <div class="my-4 flex justify-center items-center w-full">
        <img
          src="https://minio.deepbim.net:9000/deepbim-fe/1749532142227-website-maintenance.png"
          alt="Maintenance Illustration"
          class="max-h-[180px] sm:max-h-[220px] lg:max-h-[240px] object-contain mx-auto"
        />
      </div>

      <!-- Message -->
      <div class="space-y-2 mt-2">
        <h1 class="text-lg sm:text-2xl font-bold text-white">
          We're Performing Scheduled Maintenance
        </h1>
        <p class="text-sm sm:text-base text-zinc-300 leading-relaxed">
          Our team is actively updating the platform to serve you better.<br class="hidden sm:inline" />
          Please check back shortly. Thank you for your patience!
        </p>
      </div>
    </div>
  </body>
</html>
