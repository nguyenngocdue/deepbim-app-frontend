<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepBIM - Under Maintenance</title>
    <link rel="icon" href="public/images/logo_no_bg.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      @keyframes softBounce {
        0%, 100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
      }

      .animate-soft-bounce {
        animation: softBounce 1.6s infinite ease-in-out;
      }

      .fade-in {
        animation: fadeIn 1s ease-out forwards;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(30px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-[#020617] min-h-screen flex items-center justify-center px-4 sm:px-6 lg:px-8 text-white">
    <div class="w-full max-w-md sm:max-w-xl lg:max-w-3xl text-center p-6 sm:p-10 rounded-3xl bg-white/5 backdrop-blur-md shadow-2xl border border-white/10 fade-in">
      
      <!-- Logo + DeepBIM -->
      <div class="flex flex-col items-center mb-6">
        <img
          src="public/images/logo_no_bg.png"
          alt="DeepBIM Logo"
          class="w-20 sm:w-24 h-auto object-contain animate-soft-bounce"
        />
        <span class="mt-2 text-2xl sm:text-3xl font-semibold tracking-wide text-white">
          DeepBIM
        </span>
      </div>

      <!-- Illustration -->
      <div class="mb-6">
        <img
          src="public/images/website-maintenance.png"
          alt="Maintenance Illustration"
          class="w-full max-h-[220px] sm:max-h-[280px] lg:max-h-[320px] object-contain mx-auto"
        />
      </div>

      <!-- Title -->
      <h1 class="text-xl sm:text-2xl lg:text-3xl font-bold text-white mb-3">
        We're Performing Scheduled Maintenance
      </h1>

      <!-- Message -->
      <p class="text-sm sm:text-base lg:text-lg text-zinc-300 leading-relaxed">
        Our team is actively updating the platform to serve you better.<br class="hidden sm:inline" />
        Please check back shortly. Thank you for your patience!
      </p>
    </div>
  </body>
</html>
