<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>We're Updating - DeepBIM</title>
    <link rel="icon" href="/logo.png" type="image/png" />
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      .fade-in {
        animation: fadeIn 1s ease-out forwards;
      }

      @keyframes fadeIn {
        0% {
          opacity: 0;
          transform: translateY(20px);
        }
        100% {
          opacity: 1;
          transform: translateY(0);
        }
      }
    </style>
  </head>
  <body class="bg-gradient-to-br from-sky-50 via-green-50 to-white min-h-screen flex items-center justify-center px-4 dark:bg-zinc-900">
    <div
      class="max-w-md w-full bg-white/70 dark:bg-zinc-800/70 backdrop-blur-md rounded-2xl shadow-xl border border-zinc-200 dark:border-zinc-700 p-8 text-center fade-in"
    >
      <!-- Logo -->
      <img
        src="https://minio.deepbim.net:9000/deepbim-fe/1749531131956-logo_no_bg.png"
        alt="Company Logo"
        class="w-20 h-20 mx-auto mb-4 rounded-xl shadow-md hover:scale-105 transition-transform duration-300"
      />

      <!-- Title -->
      <h1 class="text-2xl font-semibold text-zinc-800 dark:text-white mb-2">
        We're Currently Updating Our Website
      </h1>

      <!-- Message -->
      <p class="text-zinc-600 dark:text-zinc-300 text-base">
        Thank you for your patience. We're making improvements to serve you
        better. Please check back in a few moments.
      </p>
    </div>
  </body>
</html>
